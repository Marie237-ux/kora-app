services:
  # API Laravel (Docker). The root Dockerfile works with the repository root as build context.
  - type: web
    name: kora-api
    runtime: docker
    plan: free
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        generateValue: true
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://kora-api.onrender.com
      - key: KORA_STOREFRONT_URL
        value: https://kora-frontend-ok9a.onrender.com
      # Online demo: same test catalogue as local, reloaded on each start (test-data banner shown on the site).
      - key: KORA_DEMO
        value: "true"
      - key: KORA_DEMO_REMOTE
        value: "true"
      - key: KORA_DEMO_SEED
        value: "true"
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: kora-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kora-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: kora-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: kora-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kora-db
          property: password

  # Storefront Astro (Node). npm workspaces: install from the root so @kora/* packages resolve.
  - type: web
    name: kora-frontend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build -w @kora/storefront
    startCommand: npm run start -w @kora/storefront
    envVars:
      - key: NODE_VERSION
        value: 22.23.4
      - key: HOST
        value: 0.0.0.0
      - key: API_INTERNAL_URL
        value: https://kora-api.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://kora-frontend-ok9a.onrender.com

databases:
  - name: kora-db
    plan: free
    databaseName: kora
    user: kora_user
